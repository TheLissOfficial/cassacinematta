<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Genera utente - Cinematta POS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { overflow: auto; display: flex; justify-content: center; padding: 30px; }
        .box { background: #141a28; border: 1px solid #222d42; border-radius: 8px; padding: 20px; width: 520px; display: flex; flex-direction: column; gap: 10px; }
        select, textarea { padding: 8px; background: #1c2538; border: 1px solid #2e3d59; color: #fff; border-radius: 4px; }
        .chips { display: flex; gap: 6px; flex-wrap: wrap; }
        .chip { font-size: 0.75rem; padding: 3px 8px; border-radius: 10px; background: #1c2538; color: #667; border: 1px solid #2e3d59; }
        .chip.on { color: #2ed573; border-color: #2ed573; }
        textarea { height: 110px; font-family: monospace; font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Genera utente cifrato</h2>
        <input type="text" id="u" class="modal-input" placeholder="Utente" style="margin:0;">
        <input type="password" id="p" class="modal-input" placeholder="Password (min. 10 caratteri)" style="margin:0;" oninput="aggiornaForza()">
        <div class="chips">
            <span class="chip" id="c-up">Maiuscole</span>
            <span class="chip" id="c-low">Minuscole</span>
            <span class="chip" id="c-num">Numeri</span>
            <span class="chip" id="c-sym">Speciali</span>
            <span class="chip" id="c-len">10+ caratteri</span>
        </div>
        <small style="color:#aaa;">Maiuscole, minuscole, numeri e caratteri speciali sono consigliati ma non obbligatori. La password è case-sensitive (anche al login); l'utente invece no.</small>
        <button class="btn-info" style="padding:8px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;" onclick="passwordCasuale()">Genera password casuale</button>
        <select id="r">
            <option value="cassiere">cassiere</option>
            <option value="admin">admin</option>
        </select>
        <button class="btn-action" onclick="genera()">Genera riga</button>
        <textarea id="out" readonly placeholder="Incolla il risultato in una nuova riga di utenti.txt"></textarea>
        <small style="color:#aaa;">Tutto avviene nel browser: la password non viene inviata né salvata.</small>
    </div>
    <script src="auth.js"></script>
    <script>
        function aggiornaForza() {
            const p = document.getElementById('p').value;
            const test = { 'c-up': /[A-Z]/, 'c-low': /[a-z]/, 'c-num': /[0-9]/, 'c-sym': /[^A-Za-z0-9]/ };
            for (const id in test) document.getElementById(id).classList.toggle('on', test[id].test(p));
            document.getElementById('c-len').classList.toggle('on', p.length >= 10);
        }

        function passwordCasuale() {
            const set = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*?-_+=';
            const r = crypto.getRandomValues(new Uint32Array(16));
            const campo = document.getElementById('p');
            campo.value = Array.from(r, n => set[n % set.length]).join('');
            campo.type = 'text';   // visibile, così puoi annotarla
            aggiornaForza();
        }

        async function genera() {
            const u = document.getElementById('u').value;
            const p = document.getElementById('p').value;
            if (!u.trim() || u.includes(';')) return alert('Utente non valido (niente ";").');
            if (p.length < 10) return alert('Password troppo corta (minimo 10 caratteri).');
            if (!/[a-z]/.test(p)) return alert('La password deve contenere almeno una lettera minuscola.');
            if (!/[A-Z]/.test(p)) return alert('La password deve contenere almeno una lettera maiuscola.');
            if (!/[^A-Za-z0-9]/.test(p)) return alert('La password deve contenere almeno un carattere speciale (es. ! @ # $ % &).');
            document.getElementById('out').value = await creaRigaUtente(u, p, document.getElementById('r').value);
        }
    </script>
</body>
</html>
